"500"></textarea><button id="send">留下回应 ＋</button></div><div id="status" role="status">写字或画画，都可以。</div></aside></div></main><footer><span>◌ 下线以后 · 共同绘制没有及时回复的生活</span><span>本机接力共绘 / 自动保存在当前浏览器</span></footer><button id="toTop" title="回到顶部">↑ 回到顶部</button><script>const $=s=>document.querySelector(s),key='offline-thread-v2';const papers=['#f9f5e5','#e7eddc','#f3e2df','#e8e7f0','#e1ecea'],inks=['#6f8061','#b8898c','#948aad','#b79e66','#728f98','#38443b','#8eac78','#bfd2a7','#d58082','#e9b7ae','#c49ac4','#665b91','#8fb8cf','#436b91','#e0bb66','#b77c50','#898780','#ffffff'];let notes=[],selected=null,draft={},dirty=false,strokes=[],ink=inks[0],activeStroke=null;const canvas=$('#canvas'),ctx=canvas.getContext('2d');try{notes=JSON.parse(localStorage.getItem(key)||'[]')}catch{}let slots=24;try{slots=Math.max(24,Number(localStorage.getItem(key+'-slots'))||24)}catch{}const previewCache=new Map();const samples=[['在厨房，把一碗热汤慢慢喝完。','❀'],['给自己留了十分钟，什么也不做。','☾'],['等你回信时，我也画了一朵花。','✿'],['下次忙的时候，发一片叶子，表示晚些再聊。','⌁'],['那一刻，我在看窗外。','✧']];function say(t){$('#status').textContent=t}function persist(){try{localStorage.setItem(key,JSON.stringify(notes));say('已保存到此浏览器。')}catch{say('浏览器存储已满，请先保存故事集。')}}function fresh(){return{id:crypto.randomUUID(),text:'',author:'',paper:papers[0],strokes:[],replies:[]}}function snapshot(){draft.text=$('#story').value;draft.author=$('#author').value;draft.strokes=structuredClone(strokes)}function autosave(){if(!dirty)return;snapshot();if(!draft.text.trim()&&!draft.strokes.length&&!selected)return;let i=notes.findIndex(n=>n.id===draft.id);if(i<0){notes.push(structuredClone(draft));selected=draft.id}else notes[i]=structuredClone(draft);dirty=false;persist();render()}function open(n){autosave();draft=structuredClone(n||fresh());selected=n?.id||null;strokes=structuredClone(draft.strokes);$('#story').value=draft.text;$('#author').value=draft.author;$('#number').textContent=n?'纸条 / '+String(notes.findIndex(x=>x.id===n.id)+1).padStart(2,'0'):'一张新纸条';$('#save').text .x:a.x-b.x);let start=ps[0];if(i===0)d+=` Q 20 ${start.y} ${start.x} ${start.y}`;else{let edge=i%2?wall.clientWidth-5:5;d+=` C ${edge} ${rows[i-1].y+60}, ${edge} ${row.y-25}, ${start.x} ${row.y}`}ps.slice(1).forEach(p=>d+=` Q ${p.x+(i%2?55:-55)} ${p.y+8} ${p.x} ${p.y}`);let end=i%2?15:wall.clientWidth-15;d+=` L ${end} ${row.y}`});svg.innerHTML='';let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','#b5bfa2');path.setAttribute('stroke-width','1.6');svg.append(path)}new ResizeObserver(thread).observe($('#wall'));function replies(){let root=$('#replies');root.innerHTML='';draft.replies.forEach(r=>{let div=document.createElement('div');div.className='response';let name=document.createElement('small');name.textContent=r.author||'一位路过的人';div.append(name,document.createTextNode(r.text));root.append(div)});$('#replycount').textContent=draft.replies.length}function tab(draw){$('#writePane').hidden=draw;$('#drawPane').hidden=!draw;$('#writeTab').classList.toggle('active',!draw);$('#drawTab').classList.toggle('active',draw);if(draw)paint()}$('#writeTab').onclick=()=>tab(false);$('#drawTab').onclick=()=>tab(true);$('#new').onclick=()=>{open();tab(false);if(innerWidth<731)$('#editor').scrollIntoView({behavior:'smooth'});$('#story').focus()};$('#story').oninput=$('#author').oninput=()=>dirty=true;function point(e){let r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*500/r.height]}canvas.onpointerdown=e=>{activeStroke={color:ink,width:Number($('#width').value),points:[point(e)]};strokes.push(activeStroke);canvas.setPointerCapture(e.pointerId);dirty=true;paint()};canvas.onpointermove=e=>{if(activeStroke){activeStroke.points.push(point(e));paint()}};canvas.onpointerup=canvas.onpointercancel=()=>activeStroke=null;$('#undo').onclick=()=>{if(strokes.length){strokes.pop();dirty=true;paint()}};$('#save').onclick=()=>{snapshot();if(!draft.text.tri
